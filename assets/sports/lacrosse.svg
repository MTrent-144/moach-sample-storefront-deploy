<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title desc"><title id="title">Youth lacrosse: feed from behind the goal to a crease cutter</title><desc id="desc">Offensive end of a lacrosse field with the end line at left, the goal circle and goal, a solid restraining line and the dashed midfield line. Six coral attackers. The ball carrier stands behind the goal with the chartreuse ball; a dashed chartreuse arrow feeds the ball around the goal circle to a cutter, whose solid arrow slides into the crease, while the two wing players step in to fill. MOACH marker on the right side.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5 1 9" fill="none" stroke="#DAEF66" stroke-width="2"/></marker></defs><rect width="900" height="620" rx="24" fill="#131D29"/><path d="M32 54H140M32 54V32H54" fill="none" stroke="#DAEF66" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M735 90H95V550H735" fill="none" stroke="#F4EFDF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M540 90V550" fill="none" stroke="#F4EFDF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M700 90V550" fill="none" stroke="#F4EFDF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7"/><path d="M215 280A40 40 0 1 1 215 360A40 40 0 1 1 215 280Z" fill="#F4EFDF" opacity=".08"/><circle cx="215" cy="320" r="40" fill="none" stroke="#F4EFDF" stroke-width="2.5"/><path d="M215 306L196 320 215 334Z" fill="none" stroke="#F4EFDF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M215 306V334" fill="none" stroke="#F4EFDF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><circle cx="140" cy="330" r="15" fill="#EF5A49" data-role="attacker"/><circle cx="300" cy="170" r="15" fill="#EF5A49" data-role="attacker"/><circle cx="300" cy="470" r="15" fill="#EF5A49" data-role="attacker"/><circle cx="400" cy="250" r="15" fill="#EF5A49" data-role="attacker"/><circle cx="400" cy="400" r="15" fill="#EF5A49" data-role="attacker"/><circle cx="470" cy="325" r="15" fill="#EF5A49" data-role="attacker"/><circle cx="155" cy="345" r="7" fill="#DAEF66" /><path d="M160 352Q225 405 286 334" fill="none" stroke="#DAEF66" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="7 7"/><path d="M388 262Q330 290 296 316" fill="none" stroke="#DAEF66" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M300 190Q330 220 352 238" fill="none" stroke="#DAEF66" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M300 450Q330 420 352 404" fill="none" stroke="#DAEF66" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="768" y="480" width="73" height="82" rx="5" fill="#F4EFDF"/><g transform="translate(775 487) scale(0.5)"><defs xmlns="http://www.w3.org/2000/svg" /><g xmlns="http://www.w3.org/2000/svg" transform="translate(10 0) scale(1.0)" fill="#131D29"><path d="M8 86V14H26L50 43 74 14H92V86H72V47L50 73 28 47V86Z" /><path d="M28 96H72V100H28Z" /></g></g></svg>