<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title desc"><title id="title">Youth cheerleading: three stunt groups and a front-line V</title><desc id="desc">Top-down cheer mat with nine panel seams and the front edge at the bottom. Across the middle are three stunt groups, each with two coral bases, a coral back spot and a chartreuse flyer inside a cream ring that marks her up in the stunt. Four coral cheerleaders stand on the front line; solid chartreuse arrows move the outside pair back and the inside pair forward into a V pointing at the crowd. MOACH marker on the right sideline.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5 1 9" fill="none" stroke="#DAEF66" stroke-width="2"/></marker></defs><rect width="900" height="620" rx="24" fill="#131D29"/><path d="M32 54H140M32 54V32H54" fill="none" stroke="#DAEF66" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M125 88H719V550H125Z" fill="none" stroke="#F4EFDF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M191 88V550" fill="none" stroke="#F4EFDF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 9" opacity=".45"/><path d="M257 88V550" fill="none" stroke="#F4EFDF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 9" opacity=".45"/><path d="M323 88V550" fill="none" stroke="#F4EFDF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 9" opacity=".45"/><path d="M389 88V550" fill="none" stroke="#F4EFDF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 9" opacity=".45"/><path d="M455 88V550" fill="none" stroke="#F4EFDF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 9" opacity=".45"/><path d="M521 88V550" fill="none" strok