<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title desc"><title id="title">Youth hockey: point shot with a net-front screen</title><desc id="desc">Attacking zone of a rink with rounded end boards at left, the goal line, crease and goal, two faceoff circles, a heavy cream blue line, neutral-zone dots and the dashed center line with part of the center circle at right. Five coral skaters. Dashed chartreuse arrows are puck movement: a pass from the half-wall up to the point, then a shot toward the goal. Solid arrows show one skater driving to the front of the net and another sliding to the far post. Small chartreuse disc is the puck. MOACH marker on the right side.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5 1 9" fill="none" stroke="#DAEF66" stroke-width="2"/></marker></defs><rect width="900" height="620" rx="24" fill="#131D29"/><path d="M32 54H140M32 54V32H54" fill="none" stroke="#DAEF66" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M735 90H246A151 151 0 0 0 95 241V399A151 151 0 0 0 246 550H735" fill="none" stroke="#F4EFDF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M155 121V519" fill="none" stroke="#F4EFDF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M155 288A32 32 0 0 1 155 352Z" fill="#F4EFDF" opacity=".1"/><path d="M155 288A32 32 0 0 1 155 352" fill="none" stroke="#F4EFDF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M155 304H140Q133 304 133 311V329Q133 336 140 336H155" fill="none" stroke="#F4EFDF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="263" cy="201" r="81" fill="none" stroke="#F4EFDF" stroke-width="2.5"/><circle cx="263" cy="201" r="6" fill="#F4EFDF" /><circle cx="528" cy="201" r="5" fill="#F4EFDF" /><circle cx="263" cy="439" r=