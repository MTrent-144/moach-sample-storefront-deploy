<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title desc"><title id="title">Youth dance: a soloist travels downstage as the line opens into a wedge</title><desc id="desc">Top-down stage with the audience at the bottom: a curved apron, wing legs on both sides and cream spike marks across the downstage line, with a larger mark at center. Six coral dancers stand in a back line of four and a middle pair. Solid chartreuse arrows move the chartreuse soloist straight downstage to center, slide the outside back-line dancers down and out, and bring the middle pair in, opening the formation into a wedge. MOACH marker on the right side.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5 1 9" fill="none" stroke="#DAEF66" stroke-width="2"/></marker></defs><rect width="900" height="620" rx="24" fill="#131D29"/><path d="M32 54H140M32 54V32H54" fill="none" stroke="#DAEF66" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M125 110H719V478Q422 540 125 478Z" fill="none" stroke="#F4EFDF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M125 185H163M719 185H681" fill="none" stroke="#F4EFDF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M125 265H163M719 265H681" fill="none" stroke="#F4EFDF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M125 345H163M719 345H681" fill="none" stroke="#F4EFDF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M185 449V461" fill="none" stroke="#F4EFDF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M264 449V461" fill="none" stroke="#F4EFDF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M343 449V461" fill="none" stroke="#F4EFDF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M422 449V461" fill="none" stroke="#F4EFDF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M501 449V461" fill="none" stroke="#F4EFDF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M580 449V461" fill="none" stroke="#F4EFDF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M659 449V461" fill="none" stroke="#F4EFDF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><path d="M422 443V467" fill="none" stroke="#F4EFDF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /><circle cx="230" cy="205" r="15" fill="#EF5A49" data-role="dancer"/><circle cx="340" cy="205" r="15" fill="#EF5A49" data-role="dancer"/><circle cx="504" cy="205" r="15" fill="#EF5A49" data-role="dancer"/><circle cx="614" cy="205" r="15" fill="#EF5A49" data-role="dancer"/><circle cx="300" cy="320" r="15" fill="#EF5A49" data-role="dancer"/><circle cx="544" cy="320" r="15" fill="#EF5A49" data-role="dancer"/><circle cx="422" cy="255" r="15" fill="#DAEF66" data-role="soloist"/><path d="M422 278V398" fill="none" stroke="#DAEF66" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M222 226L198 286" fill="none" stroke="#DAEF66" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M622 226L646 286" fill="none" stroke="#DAEF66" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M314 336L354 366" fill="none" stroke="#DAEF66" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M530 336L490 366" fill="none" stroke="#DAEF66" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="768" y="480" width="73" height="82" rx="5" fill="#F4EFDF"/><g transform="translate(775 487) scale(0.5)"><defs xmlns="http://www.w3.org/2000/svg" /><g xmlns="http://www.w3.org/2000/svg" transform="translate