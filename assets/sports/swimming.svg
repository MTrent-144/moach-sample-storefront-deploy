<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title desc"><title id="title">Youth swimming: a relay leg heads into the turn</title><desc id="desc">Top-down six-lane pool with starting blocks along the left wall, dashed cream lane ropes, faint lane lines with T ends on the bottom and dotted backstroke-flag lines near each wall. Five coral swimmers race toward the far wall, each with a short solid arrow. The chartreuse leader in lane three reaches the wall first; a dashed arrow curls back for the flip turn. The next relay swimmer waits in coral on the lane-three block. MOACH marker on the right side.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5 1 9" fill="none" stroke="#DAEF66" stroke-width="2"/></marker></defs><rect width="900" height="620" rx="24" fill="#131D29"/><path d="M32 54H140M32 54V32H54" fill="none" stroke="#DAEF66" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M125 100H719V540H125Z" fill="none" stroke="#F4EFDF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M125 173H719" fill="none" stroke="#F4EFDF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 6"/><path d="M125 247H719" fill="none" stroke="#F4EFDF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 6"/><path d="M125 320H719" fill="none" stroke="#F4EFDF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 6"/><path d="M125 393H719" fill="none" stroke="#F4EFDF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 6"/><path d="M125 467H719" fill="none" stroke="#F4EFDF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 6"/><path d="M175 137H669M175 127V147M669 127V147" fill="none" stroke="#F4EFDF" stroke-width="4" stro