<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title desc"><title id="title">Youth tennis doubles: serve, return and a poach at the net</title><desc id="desc">Top-down doubles court with the net running vertically through the middle, singles and doubles sidelines, service lines and the center service line. The serving team is coral on the right: the server behind the baseline with the chartreuse ball and the partner at the net. Opponents are cream Xs. A dashed chartreuse arrow carries the serve crosscourt into the service box, a second dashed arrow carries the return back toward the middle, and a solid arrow shows the net player crossing to poach it. MOACH marker on the right side.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M1 1L9 5 1 9" fill="none" stroke="#DAEF66" stroke-width="2"/></marker></defs><rect width="900" height="620" rx="24" fill="#131D29"/><path d="M32 54H140M32 54V32H54" fill="none" stroke="#DAEF66" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><path d="M125 183H719V457H125ZM125 217H719M125 423H719M262 217V423M582 217V423M262 320H582" fill="none" stroke="#F4EFDF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M125 320H137M719 320H707" fill="none" stroke="#F4EFDF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" /><path d="M422 170V470" fill="none" stroke="#F4EFDF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><circle cx="422" cy="170" r="5" fill="#F4EFDF" /><circle cx="422" cy="470" r="5" fill="#F4EFDF" /><path d="M139 237l22 22M161 237l-22 22" fill="none" stroke="#F4EFDF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" data-role="opponent"/><path d="M289 379l22 22M311 379l-22 22" fill="none" stroke="#F4EFDF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" data-role="opponent"/><circle cx="735" cy="395" r="15" fill="#EF5A49" data-role="server"/><circle cx="482" cy="252" r="15" fill="#EF5A49" data-role="net-player"/><circle cx="722" cy="382" r="6" fill="#DAEF66" /><path d="M712 378L318 262" fill="none" stroke="#DAEF66" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="7 7"/><path d="M164 254L432 304" fill="none" stroke="#DAEF66" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="7 7"/><path d="M478 272Q470 296 452 314" fill="none" stroke="#DAEF66" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="768" y="480" width="73" height="82" rx="5" fill="#F4EFDF"/><g transform="translate(775 487) scale(0.5)"><defs xmlns="http://www.w3.org/2000/svg" /><g xmlns="http://www.w3.org/2000/svg" transform="translate(10 0) scale(1.0)" fill="#131D29"><path d="M8 86V14H26L50 43 74 14H92V86H72V47L50 73 28 47V86Z" /><path d="M28 96H72V100H28Z" /></g></g></svg>